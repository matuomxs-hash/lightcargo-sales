name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract app
        run: |
          mkdir android-project
          unzip -q lightcargo_sales_app_android_updated.zip -d android-project

      - name: Find Gradle project
        run: |
          GRADLEW=$(find android-project -name gradlew -type f | head -1)
          echo "Found: $GRADLEW"
          test -n "$GRADLEW"
          chmod +x "$GRADLEW"
          echo "GRADLEW=$GRADLEW" >> "$GITHUB_ENV"
          echo "PROJECT_DIR=$(dirname "$GRADLEW")" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lightcargo-apk
          path: '**/build/outputs/apk/debug/*.apk'

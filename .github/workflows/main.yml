name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract app
        run: |
          mkdir android-project
          unzip -q lightcargo_sales_app_android_updated.zip -d android-project

      - name: Find Android project
        run: |
          SETTINGS=$(find android-project -name settings.gradle -o -name settings.gradle.kts | head -1)
          echo "Found: $SETTINGS"
          test -n "$SETTINGS"
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lightcargo-apk
          path: '**/build/outputs/apk/debug/*.apk'
